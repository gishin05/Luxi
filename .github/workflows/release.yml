name: Release
on:
  push:
    tags:
      - v*

env:
  LUXI_GITHUB_RELEASE: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  get_tag:
    if: github.repository == 'gishin05/Luxi'
    name: Extract tag name
    runs-on: 'ubuntu-26.04'
    outputs:
      tag: ${{ steps.extract.outputs.tag }}

    steps:
      - name: Get tag name
        id: extract
        run: echo "tag=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT

  build:
    if: github.repository == 'gishin05/Luxi'
    name: Build
    runs-on: 'ubuntu-26.04'
    needs: get_tag

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Decode signing keystore
        run: echo "$SIGNING_KEY" | base64 -d > "${{ runner.temp }}/luxi.keystore"
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      - name: Build
        run: ./gradlew assembleRelease -Penable-updater
        env:
          storeFile: ${{ runner.temp }}/luxi.keystore
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: |
          set -e

          mv app/build/outputs/apk/release/app-universal-release.apk luxi-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-arm64-v8a-release.apk luxi-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-armeabi-v7a-release.apk luxi-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-x86-release.apk luxi-x86-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-x86_64-release.apk luxi-x86_64-${{ needs.get_tag.outputs.tag }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: luxi
          path: |
            luxi-${{ needs.get_tag.outputs.tag }}.apk
            luxi-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
            luxi-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
            luxi-x86-${{ needs.get_tag.outputs.tag }}.apk
            luxi-x86_64-${{ needs.get_tag.outputs.tag }}.apk

  release:
    if: github.repository == 'gishin05/Luxi'
    name: Create GitHub Release
    runs-on: ubuntu-26.04
    needs: [get_tag, build]

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true

      - name: Delete all artifacts
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          failOnError: false
          name: luxi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.get_tag.outputs.tag }}
          name: Luxi ${{ needs.get_tag.outputs.tag }}
          body: |
            Check out the [past release notes](https://github.com/gishin05/Luxi/releases) if you're upgrading from an earlier version.

            <!-->

            ### Improvements
            - **Two-Phase 20-Chapter Batch Loading:** The initial refresh spinner now finishes right after the synopsis and first batch of latest chapters load, while older chapters stream smoothly in ~20-chapter batches using the bottom `"Loading more chapters…"` footer.
            - **Live Chapter Counter & Clean Gap Display:** Shows loaded chapter progress in the footer and hides temporary `"Missing X chapters"` notices until all batches finish loading.
            - **Auto-Resume Partial Lists & CAPTCHA Recovery:** Automatically resumes loading missing older chapters when reopening a partially loaded Comix manga, and displays `"Open WebView"` and `"Retry"` controls in the footer if verification is required (without automatic retry loops).

            ### Bug Fixes
            - **Gentle Native DOM Pagination:** Removed aggressive `limit=100` API and synthetic SSR probing in the built-in Comix.to extension, using native page turns with 1.5s pacing to reduce CAPTCHA triggers and initial load wait time.

            <!-->

            > [!TIP]
            >
            > ### If you are unsure which version to download then go with `luxi-${{ needs.get_tag.outputs.tag }}.apk`
          files: |
            luxi-${{ needs.get_tag.outputs.tag }}.apk
            luxi-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
            luxi-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
            luxi-x86-${{ needs.get_tag.outputs.tag }}.apk
            luxi-x86_64-${{ needs.get_tag.outputs.tag }}.apk
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
